<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim | ShipProof</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shipproof.css"></head>
<body><div class="page" id="root"></div>
<script type="module">
import { api, h, fmtTime, say, header } from "/js/api.js";
const root = document.getElementById("root");
const id = location.pathname.split("/").filter(Boolean).pop();
const titles = { supports_claim: "Evidence supports the claim", does_not_support_claim: "Evidence does not support the claim", inconclusive: "Evidence is inconclusive" };
const actions = { approve_refund: "Approve refund", deny_refund: "Deny refund", request_more_info: "Request more information", manual_review: "Send to manual review" };
const kindText = { impact: "Impact", free_fall: "Free fall", tilt: "Tilted past limit" };
const unit = { impact: "g", free_fall: "g", tilt: "°" };
let me;

async function load() {
  const [m, v] = await Promise.all([api("GET", "/auth/me"), api("GET", "/claims/" + encodeURIComponent(id))]);
  me = m;
  const { claim, parcel, evidence: ev, integrity, investigator, canAppeal } = v;
  root.replaceChildren(header("Console", m.org.name), h("div", { class: "stack" },
    h("a", { href: "/console" }, "← Back to console"),
    h("section", { class: "panel pad" }, h("h2", null, "Claim"),
      h("dl", { class: "kv" }, h("dt", null, "Order"), h("dd", null, parcel.orderRef), h("dt", null, "Profile"), h("dd", null, parcel.profileLabel + " (impact limit " + parcel.limits.shockG + " g)"),
        h("dt", null, "Claimant"), h("dd", null, claim.claimant), h("dt", null, "Filed"), h("dd", null, fmtTime(claim.filedAt)), h("dt", null, "Status"), h("dd", null, claim.status)),
      h("p", null, h("em", null, "“" + claim.statement + "”")), h("p", { class: "note" }, "The statement is the claimant's word. The investigator treats it as unverified and decides from the sensor evidence.")),
    evidencePanel(ev, parcel),
    decisionPanel(claim, integrity, investigator, canAppeal, ev),
    claim.appeal ? h("section", { class: "panel pad" }, h("h2", null, "Appeal"), h("p", null, claim.appeal.note), h("p", { class: "note" }, "By " + claim.appeal.by + ", " + fmtTime(claim.appeal.at))) : null,
    claim.resolution ? h("section", { class: "panel pad" }, h("h2", null, "Resolution"), h("p", null, claim.resolution.outcome.replace("_", " ")), claim.resolution.note ? h("p", null, claim.resolution.note) : null) : null));
}

function evidencePanel(ev, parcel) {
  if (!ev) return h("section", { class: "panel pad" }, h("h2", null, "Evidence"), h("p", { class: "empty" }, "This parcel was never dispatched, so there is no evidence."));
  if (!ev.readingCount) return h("section", { class: "panel pad" }, h("h2", null, "Evidence"), h("p", { class: "empty" }, "The tag sent no readings during delivery."));
  const peak = Math.max(...ev.buckets.map((b) => b.maxG), parcel.limits.shockG);
  return h("section", { class: "panel pad" }, h("h2", null, "Evidence"),
    h("dl", { class: "kv" }, h("dt", null, "Readings"), h("dd", null, ev.readingCount), h("dt", null, "Coverage"), h("dd", null, Math.round(ev.coverage * 100) + "% of the delivery window"),
      h("dt", null, "Peak force"), h("dd", null, (ev.peakG ?? 0).toFixed(2) + " g at " + fmtTime(ev.peakTs)), h("dt", null, "Evidence hash"), h("dd", { class: "mono" }, ev.evidenceHash)),
    h("div", { class: "bars", role: "img", "aria-label": "Peak force over the delivery window" }, ev.buckets.map((b) => h("i", { class: b.maxG > parcel.limits.shockG ? "hot" : "", style: "height:" + Math.max(2, (b.maxG / peak) * 100) + "%", title: fmtTime(b.startTs) + ": " + b.maxG + " g" }))),
    h("p", { class: "note" }, "Red bars exceeded this parcel's impact limit."),
    ev.events.length ? h("table", { class: "tbl" }, h("tr", null, h("th", null, "Event"), h("th", null, "When"), h("th", null, "Peak")),
      ev.events.map((e) => h("tr", null, h("td", null, kindText[e.kind]), h("td", null, fmtTime(e.startTs)), h("td", null, e.peak.toFixed(2) + " " + unit[e.kind])))) : h("p", { class: "empty" }, "No reading went past this parcel's limits."),
    ev.gaps.length ? h("p", { class: "note" }, ev.gaps.length + " gap(s) with no readings, " + ev.gapSeconds + " s in total.") : null,
    ev.afterDelivery.readingCount ? h("p", { class: "note" }, ev.afterDelivery.readingCount + " reading(s) arrived after delivery, with " + ev.afterDelivery.events.length + " event(s). They are kept apart from the delivery evidence.") : null);
}

function decisionPanel(claim, integrity, inv, canAppeal, ev) {
  const d = claim.decision;
  if (!d) {
    const msg = h("p", { class: "msg", role: "status" }, claim.lastError ? "Last attempt failed: " + claim.lastError.message : "");
    if (claim.lastError) msg.classList.add("err");
    const busy = claim.status === "investigating";
    return h("section", { class: "panel pad" }, h("h2", null, "Investigation"),
      !inv.configured && ev && ev.readingCount ? h("p", { class: "note" }, "The investigator isn't connected yet: the server has no SERV_API_KEY. Evidence above is real; a verdict needs the key.") : null,
      h("div", { class: "row" }, h("button", { class: "btn", disabled: busy || claim.status === "closed", onclick: async (e) => { e.target.disabled = true; say(msg, "Investigating..."); try { await api("POST", "/claims/" + id + "/investigate", {}); await load(); } catch (err) { say(msg, err.message, true); e.target.disabled = false; } } }, busy ? "Investigation running" : "Run investigator")), msg,
      claim.status !== "closed" ? closeForm() : null);
  }
  const v = d.verdict;
  return h("section", { class: "panel pad" }, h("h2", null, "Decision"),
    h("div", { class: "verdict v-" + v.outcome }, h("h3", null, titles[v.outcome]), h("p", null, v.summary),
      h("p", null, h("span", { class: "pill" }, "Confidence: " + v.confidence), " ", h("span", { class: "pill" }, "Recommended: " + actions[v.recommendedAction]))),
    v.findings.length ? h("ul", null, v.findings.map((f) => h("li", null, f.text, f.ts ? h("span", { class: "note" }, " (" + fmtTime(f.ts) + ")") : null))) : null,
    v.limits.length ? h("div", null, h("h2", null, "What the sensors can't show"), h("ul", null, v.limits.map((l) => h("li", null, l)))) : null,
    h("dl", { class: "kv" }, h("dt", null, "Decided by"), h("dd", null, d.via === "serv-reasoning" ? "SERV Reasoning (" + d.model + ")" : "Rules (no readings, no model call)"),
      h("dt", null, "Decided"), h("dd", null, fmtTime(d.decidedAt)), h("dt", null, "Appeal until"), h("dd", null, fmtTime(d.appealUntil)),
      h("dt", null, "Record hash"), h("dd", { class: "mono" }, d.recordHash)),
    h("p", null, h("span", { class: "pill " + (integrity.recordIntact ? "good" : "bad") }, integrity.recordIntact ? "Record unaltered" : "Record altered"), " ",
      h("span", { class: "pill " + (integrity.evidenceUnchanged ? "good" : "warn") }, integrity.evidenceUnchanged ? "Evidence unchanged since decision" : "Readings changed since decision")),
    canAppeal ? appealForm() : null, claim.status === "closed" ? null : closeForm());
}

function appealForm() {
  const note = h("textarea", { maxlength: 1000, placeholder: "Why are you appealing?" }), msg = h("p", { class: "msg", role: "status" });
  return h("form", { class: "form", onsubmit: async (e) => { e.preventDefault(); try { await api("POST", "/claims/" + id + "/appeal", { note: note.value, by: me.user.email }); await load(); } catch (err) { say(msg, err.message, true); } } },
    h("h2", null, "Appeal"), note, h("button", { class: "btn sm ghost", type: "submit" }, "Submit appeal"), msg);
}
function closeForm() {
  const sel = h("select", null, h("option", { value: "refund_approved" }, "Refund approved"), h("option", { value: "refund_denied" }, "Refund denied"), h("option", { value: "other" }, "Other")),
    note = h("input", { placeholder: "Note (optional)", maxlength: 1000 }), msg = h("p", { class: "msg", role: "status" });
  return h("form", { class: "form", onsubmit: async (e) => { e.preventDefault(); try { await api("POST", "/claims/" + id + "/close", { resolution: sel.value, note: note.value }); await load(); } catch (err) { say(msg, err.message, true); } } },
    h("h2", null, "Your decision"), h("div", { class: "row" }, sel, note), h("button", { class: "btn sm", type: "submit" }, "Close claim"), msg);
}
load().catch((e) => { if (e.message !== "Signed out") root.replaceChildren(h("p", { class: "msg err" }, e.message)); });
</script></body></html>
